<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <style>
      body {
        background-image: url('bg.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
      }
      .container {
        max-width: 400px;
        margin-top: 5rem;
      }
      .form-signin {
        background-color: #FFFFFF;
        border: 1px solid #CCCCCC;
        border-radius: 5px;
        padding: 30px;
        box-shadow: 0 0 10px #CCCCCC;
      }
      .form-signin input[type="text"],
      .form-signin input[type="password"],
      .form-signin input[type="email"] {
        margin-bottom: 10px;
      }
      .top {
        border-radius: 5px 5px 0 0;
      }
      .bottom {
        border-radius: 0 0 5px 5px;
      }
      .btn {
        border-radius: 20px;
        font-weight: bold;
        letter-spacing: 1px;
        margin-top: 10px;
      }
      #go-to-reg,
      #go-to-login {
        margin-top: 20px;
      }
      .themecolor {
        color: #0B9A6A;
      }
      label {
        color: #333333;
        font-weight: bold;
      }
    </style>
    <script>
        function scrollToRegForm() {
          document.getElementById("reg-form").scrollIntoView({ behavior: 'smooth' });
        }
        
        </script>
    

  </head>
  <body>
    <div class="container">
      <!-- login form -->
      <form id="login-form" class="form-signin" autocomplete="off" onsubmit="return validateForm()" method="post" action="movie.html">
        <h1 class="display-4 mb-4 themecolor"><i class="fas fa-check-double"></i></h1>
        <h1 class="h3 mb-3 font-weight-normal"><b>MOVIE TICKET BOOKING</b></h1>
        <label for="inputEmail" class="sr-only">Username</label>
        <input type="text" id="inputEmail" class="form-control top active" placeholder="Username" required autofocus>
        <label for="inputPassword" class="sr-only">Password</label>
        <input type="password" id="inputPassword" class="form-control bottom" placeholder="Password" required>
        <button type="submit" class="btn btn-lg btn-outline-success btn-block">Sign In</button>
        <button id="go-to-reg" class="btn btn-lg btn-outline-danger btn-block" type="button" onclick="showRegForm()">NEW USER?</button>
        <div id="invalid-input" class="container"></div>
      </form>
      
      <script>
       
            function createAccount() {
  

        function validateForm() {
  var username = document.getElementById("inputEmail").value;
  var password = document.getElementById("inputPassword").value;

  // Send a request to the server to authenticate the user
  fetch('/authenticate', {
    method: 'POST',
    body: JSON.stringify({
      username: username,
      password: password
    }),
    headers: {
      'Content-Type': 'application/json'
    }
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // If authentication is successful, redirect the user to the dashboard
      window.location.href = '/dashboard';
    } else {
      // If authentication fails, show an error message
      alert(data.message);
    }
  })
  .catch(error => {
    console.error('Error:', error);
  });

  return false; // Prevent the form from submitting normally
}

      
      // code to create account and save data in database
  alert("Account created successfully!");
}
</script>
      
      <script>
        function showRegForm() {
          document.getElementById("reg-form").style.display = "block";
          document.getElementById("login-form").style.display = "none";
        }
        </script>
        

      <!-- registration form -->
        <form id="reg-form" class="form-signin" autocomplete="off" style="display: none;" >
        <h1 class="display-4 mb-4 themecolor"><i class="fas fa-check-double"></i></h1>
        <h1 class="h3 mb-3 font-weight-normal"><b>Create Account</b></h1>
        <label for="regUsername" class="sr-only">Username</label>
        <input type="text" id="regUsername" class="form-control top active" placeholder="Username">
        <label for="regEmail" class="sr-only">Email</label>
        <input type="email" id="regEmail" class="form-control middle" placeholder="Email">
        <label for="regPassword" class="sr-only">Password</label>
        <input type="password" id="regPassword" class="form-control bottom" placeholder="Password">
        <button type="submit" class="btn btn-lg btn-outline-success btn-block" href="#">Create Account</button>
        <button id="go-to-login" class="btn btn-lg btn-outline-danger btn-block" type="button" onclick="location.href='#login-form'">CANCEL</button>
        <div id="invalid-input-reg" class="container"></div>
        
      </form>
    </div>
</body>
</html>
